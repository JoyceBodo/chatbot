project:
  name: "AHDS-RAG"
  full_name: "Adaptive Hybrid Dense-Sparse Retrieval-Augmented Generation"

  title: "Adaptive Hybrid Dense-Sparse Retrieval-Augmented Generation Framework for Information Retrieval from Unstructured Financial Statements of Firms Listed on the Nairobi Securities Exchange"

  country: "Kenya"
  exchange: "Nairobi Securities Exchange"

  study_start_year: 1986
  study_end_year: 2023

data_source:
  organisation: "Capital Markets Authority"
  portal: "CMA Annual Report Portal"
  url: "https://annualreport.cma.or.ke"

corpus:
  sectors:
    - "AGRICULTURAL"
    - "AUTOMOBILES AND ACCESSORIES"
    - "BANKING"
    - "COMMERCIAL AND SERVICES"
    - "CONSTRUCTION AND ALLIED"
    - "ENERGY AND PETROLEUM"
    - "EXCHANGE TRADE FUNDS"
    - "INVESTMENT"
    - "INVESTMENT SERVICES"
    - "MANUFACTURING AND ALLIED"
    - "REAL ESTATE INVESTMENT TRUST"
    - "TELECOMMUNICATION AND TECHNOLOGY"
    - "INSURANCE"

  sector_count: 13

  reports_are_retrieval_corpus: true
  reports_are_training_data: false

storage:
  github_project_root: "/content/chatbot"
  drive_project_root: "/content/drive/MyDrive/AHDS_RAG"

retrieval:
  dense_model: "sentence-transformers/all-MiniLM-L6-v2"
  dense_top_k: 20

  sparse_model: "BM25"
  sparse_top_k: 20

  fusion:
    method: "Reciprocal Rank Fusion"
    k: 60
    top_k: 20

  reranker:
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    top_k: 5

generation:
  provider: "huggingface"
  model: "meta-llama/Llama-3.1-8B-Instruct"
  temperature: 0.0
  max_new_tokens: 512
  evidence_only: true
  require_citations: true

ocr:
  enabled: true
  minimum_text_length: 30
  dpi: 200

chunking:
  max_characters: 2500
  overlap_characters: 250

evaluation:
  retrieval:
    - "Precision@k"
    - "Recall@k"
    - "F1@k"
    - "MRR"
    - "nDCG"

  generation:
    - "Answer Accuracy"
    - "Faithfulness"
    - "Answer Relevance"
    - "Citation Correctness"

  system:
    - "Latency"

logging:
  level: "INFO"
  save_logs: true
